# On tranquility, override listen and database in /etc/concordia/config.toml.
# The systemd unit runs with StateDirectory=concordia, so the deployed path is
# database = "/var/lib/concordia/concordia.db". This example points at the
# working directory so `make run` works from a checkout.
[server]
listen      = "127.0.0.1:8080"
database    = "concordia.db"
window_back = "60d"
window_fwd  = "400d"

[serve]
# Prefix every event summary with "[owner] " in CalDAV collections and ICS
# feeds. Helpful for clients that show one merged calendar, noisy otherwise.
summary_prefix = false
# IANA zone the web view renders times in (the wall tablet's local zone).
# Empty uses the host's zone.
timezone = "America/Los_Angeles"

[[account]]
person   = "brandon"
provider = "icloud"
name     = "iCloud"
username = "brandon@example.com"
# app-specific password read from the credential file, not stored here

[google]
# Dev fallback for the downloaded OAuth client secret. In production this comes
# from the systemd credential "google_oauth" and this line is omitted.
credential_file = "google_oauth.json"

[graph]
# A Microsoft Entra "Mobile and desktop" app is a public client: the client id
# and tenant are not secrets, and there is no client secret.
client_id = "00000000-0000-0000-0000-000000000000"
tenant    = "common"   # or "organizations", "consumers", or a tenant GUID

[[account]]
person   = "brandon"
provider = "google"
name     = "Gmail"
# credential_ref defaults to a slug of name ("gmail"); the OAuth token is stored
# at <state-dir>/tokens/gmail.json. Run: concordiad auth google --account Gmail

[[account]]
person   = "brandon"
provider = "graph"
name     = "Work Outlook"
# Run: concordiad auth graph --account "Work Outlook"

[[rule]]
match_calendar = "Work"
action         = "redact"

[[rule]]
match_title = "(?i)soccer|practice"
action      = "tag"
tag         = "kids"

[[view]]
name      = "no-work"
predicate = "not tag:work"

[[view]]
name      = "kids"
predicate = "tag:kids"
